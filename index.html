<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LaptopHub - Online Laptop Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>LaptopHub</h1>
    <p>Quality laptops at fair prices</p>
    <nav>
      <button id="btnShop" class="active" onclick="showPage('shop')">Shop</button>
      <button id="btnCart" onclick="showPage('cart')">Cart (<span id="cartCount">0</span>)</button>
    </nav>
  </header>

  <main>

    <section id="shopPage">
      <h2>Our Laptops</h2>

      <div class="filters">
        <input type="text" id="searchName" placeholder="Search laptop name">

        <select id="searchBrand">
          <option value="all">All brands</option>
          <option value="HP">HP</option>
          <option value="Dell">Dell</option>
          <option value="Lenovo">Lenovo</option>
          <option value="Apple">Apple</option>
          <option value="Acer">Acer</option>
          <option value="ASUS">ASUS</option>
        </select>

        <input type="number" id="searchPrice" placeholder="Maximum price (KES)">

        <button onclick="filterProducts()">Search</button>
        <button class="grey" onclick="clearFilters()">Clear</button>
      </div>

      <p id="resultCount"></p>
      <div id="productList"></div>
    </section>

    <section id="cartPage" class="hidden">
      <h2>Your Shopping Cart</h2>

      <div id="cartItems"></div>
      <h3 id="cartTotal"></h3>

      <div id="checkoutBox">
        <h2>Checkout</h2>
        <form id="checkoutForm" onsubmit="placeOrder(event)">
          <label>Full name</label>
          <input type="text" id="custName" required>

          <label>Phone number</label>
          <input type="tel" id="custPhone" placeholder="e.g. 0712345678" required>

          <label>Delivery location</label>
          <input type="text" id="custLocation" placeholder="e.g. Kakamega Town" required>

          <label>Payment method</label>
          <select id="payment">
            <option value="M-Pesa">M-Pesa</option>
            <option value="Cash on Delivery">Cash on Delivery</option>
          </select>

          <button type="submit">Place Order</button>
        </form>
      </div>

      <div id="orderMessage" class="hidden"></div>
    </section>
    <div class="whatsapp-container">
  <a href="https://wa.me/254787746377" target="_blank" class="whatsapp-btn">
    Chat on WhatsApp
  </a>
</div>
   
  </main>

  <footer>
    <p>LaptopHub &copy; 2026 | Class Project</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
